name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.go')
          out="$("$(go env GOROOT)/bin/gofmt" -l "${files[@]}")"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Test, including process exit and recovery
        run: go test -race -count=1 -timeout=180s ./...

  distributed-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Check independently downloadable dependencies
        run: |
          go mod download
          go build -mod=readonly .
          go vet -mod=readonly .
          go test -mod=readonly -race -count=1 -timeout=180s .
      - name: Use current checkout for source regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-distributed.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Check task contracts against current source
        run: go test -mod=readonly -race -count=1 -timeout=180s .

  sqlite-store:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sqlitestore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sqlitestore/go.mod
          cache-dependency-path: sqlitestore/go.sum
      - name: Download SQLite module dependencies
        run: go mod download
      - name: Use current checkout for source regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-sqlite.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/sqlitestore"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Build SQLite Store
        run: go build ./...
      - name: Vet SQLite Store
        run: go vet ./...
      - name: Test SQLite Store contracts and process ownership
        run: go test -race -count=1 -timeout=180s ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run exact bilingual SQLite tutorial
        run: python ../scripts/check_database_tutorials.py sqlite

  distributed-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Check independently downloadable worker dependencies
        run: |
          go mod download
          go build -mod=readonly ./worker
          go vet -mod=readonly ./worker
          go test -mod=readonly -race -count=1 -timeout=180s ./worker
      - name: Use current checkout for worker regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-distributed-worker.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Check worker against current runtime
        run: go test -mod=readonly -race -count=1 -timeout=180s ./worker

  distributed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: durable_test
          POSTGRES_PASSWORD: durable-ci
          POSTGRES_DB: durable_distributed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable_test -d durable_distributed_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Build and vet independently
        run: |
          go mod download
          go build -mod=readonly ./postgres
          go vet -mod=readonly ./postgres
      - name: Use current checkout for source regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-distributed-postgres.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Test real PostgreSQL ownership and permissions
        env:
          PULSE_DISTRIBUTED_TEST_ALLOW_DESTRUCTIVE: "yes"
          PULSE_DISTRIBUTED_TEST_DSN: postgres://durable_test:durable-ci@127.0.0.1:5432/durable_distributed_test?sslmode=disable
        run: go test -mod=readonly -race -count=1 -timeout=240s -v ./postgres

  distributed-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: durable_test
          POSTGRES_PASSWORD: durable-ci
          POSTGRES_DB: durable_distributed_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U durable_test -d durable_distributed_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Build and vet system harness
        run: |
          go mod download
          go build -mod=readonly ./systemtest/...
          go vet -mod=readonly ./systemtest/...
      - name: Use current checkout for system regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-distributed-system.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Test real independent worker processes
        env:
          PULSE_DISTRIBUTED_TEST_ALLOW: "yes"
          PULSE_DISTRIBUTED_TEST_DSN: postgres://durable_test:durable-ci@127.0.0.1:55432/durable_distributed_test?sslmode=disable
        run: go test -mod=readonly -race -count=1 -timeout=8m -v ./systemtest/...

  distributed-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: durable_test
          POSTGRES_PASSWORD: durable-ci
          POSTGRES_DB: durable_dist_security_20261025
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U durable_test -d durable_dist_security_20261025"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Build and vet fault verification
        run: |
          go mod download
          go build -mod=readonly ./internal/faultproxy
          go test -mod=readonly -c -o "$RUNNER_TEMP/distributed-network.test" ./networktest
          go vet -mod=readonly ./networktest ./internal/faultproxy
      - name: Use current checkout for network regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-distributed-network.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Test proxy and real PostgreSQL response loss
        env:
          PULSE_DISTRIBUTED_TEST_ALLOW_DESTRUCTIVE: "yes"
          PULSE_DISTRIBUTED_TEST_DSN: postgres://durable_test:durable-ci@127.0.0.1:55432/durable_dist_security_20261025?sslmode=disable
        run: go test -mod=readonly -race -count=1 -parallel=1 -timeout=240s -v ./internal/faultproxy ./networktest

  distributed-acceptance-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: distributed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distributed/go.mod
          cache-dependency-path: distributed/go.sum
      - name: Build and vet acceptance controllers
        run: |
          go mod download
          go build -mod=readonly ./crossmachine/... ./soaktest/...
          go vet -mod=readonly ./crossmachine/... ./soaktest/...
      - name: Test local controller lifecycles without remote access
        run: go test -mod=readonly -race -count=1 -timeout=180s ./crossmachine/... ./soaktest/...

  postgres-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: durable-ci
          POSTGRES_DB: durable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: postgresstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: postgresstore/go.mod
          cache-dependency-path: postgresstore/go.sum
      - name: Download PostgreSQL module dependencies
        run: go mod download
      - name: Use current checkout for source regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-postgres.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/postgresstore"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Build PostgreSQL Store
        run: go build ./...
      - name: Vet PostgreSQL Store
        run: go vet ./...
      - name: Test PostgreSQL Store contracts and advisory ownership
        env:
          PULSE_POSTGRES_TEST_DSN: postgres://postgres:durable-ci@127.0.0.1:5432/durable_test?sslmode=disable
        run: go test -race -count=1 -timeout=180s ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run exact bilingual PostgreSQL tutorial
        env:
          PULSE_POSTGRES_DSN: postgres://postgres:durable-ci@127.0.0.1:5432/durable_test?sslmode=disable
        run: python ../scripts/check_database_tutorials.py postgresql

  benchmark-correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: benchmarks/workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/workflow/go.mod
          cache-dependency-path: benchmarks/workflow/go.sum
      - name: Use current checkout for benchmark API regression
        shell: bash
        run: |
          work="$RUNNER_TEMP/durable-benchmark.work"
          GOWORK=off go work init "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/distributed" "${GITHUB_WORKSPACE}/sqlitestore" "${GITHUB_WORKSPACE}/postgresstore" "${GITHUB_WORKSPACE}/benchmarks/workflow"
          mv go.work "$work"
          echo "GOWORK=$work" >> "$GITHUB_ENV"
      - name: Reject legacy full-snapshot Save adapters
        shell: bash
        run: |
          if grep -R -n --include='*.go' -E '\.Save\(|Save\(' durable.go; then
            echo 'legacy Save persistence API found in benchmark adapter'
            exit 1
          fi
      - name: Build isolated benchmark adapters
        run: go build ./...
      - name: Vet benchmark adapters
        run: go vet ./...
      - name: Check equal results and real process recovery
        run: go test -race -count=1 -timeout=180s ./...
      # Full timing matrices run manually; noisy shared CI timing is not a performance gate.
